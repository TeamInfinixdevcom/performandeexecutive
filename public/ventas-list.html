<!-- PESTAÑA: LISTA DE VENTAS -->
<div id="tab-ventasList" class="tab-content" style="display: none; padding: 20px;">
  <h2 style="margin: 0 0 20px 0; color: #1976D2; font-size: 24px;">📋 Historial de Ventas</h2>

  <!-- FILTROS -->
  <div style="background: #f5f5f5; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
    <h3 style="margin: 0 0 15px 0; color: #1976D2; font-size: 16px;">🔍 Filtros de Búsqueda</h3>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 15px;">
      <!-- Filtro: Tipo -->
      <div>
        <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px;">📊 Tipo de Venta</label>
        <select id="filterType" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; box-sizing: border-box;">
          <option value="all">--- TODAS ---</option>
          <option value="mobile">📱 Móvil</option>
          <option value="home">🏠 Hogar</option>
        </select>
      </div>

      <!-- Filtro: Número de Pedido -->
      <div>
        <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px;">📌 Número de Pedido</label>
        <input id="filterOrderNumber" type="text" placeholder="Ej: KO-5228" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; box-sizing: border-box;">
      </div>

      <!-- Filtro: Cédula -->
      <div>
        <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px;">🆔 Cédula</label>
        <input id="filterCedula" type="text" placeholder="Ej: 109460" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; box-sizing: border-box;">
      </div>

      <!-- Botón Filtrar -->
      <div style="display: flex; flex-direction: column; justify-content: flex-end;">
        <button id="applyFilterBtn" style="padding: 10px 20px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; transition: all 0.3s;">🔍 Filtrar</button>
      </div>
    </div>

    <!-- Fila 2: Orden SIMO y Botón Limpiar -->
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 15px; margin-top: 12px;">
      <!-- Filtro: Orden SIMO -->
      <div>
        <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px;">🏠 Orden SIMO</label>
        <input id="filterSimoNumber" type="text" placeholder="Ej: SIMO-123456" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; box-sizing: border-box;">
      </div>

      <div></div>
      <div></div>

      <!-- Botón Limpiar -->
      <div style="display: flex; flex-direction: column; justify-content: flex-end;">
        <button id="clearFilterBtn" style="padding: 10px 20px; background: #FF9800; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; transition: all 0.3s;">🔄 Limpiar</button>
      </div>
    </div>
  </div>

  <!-- RESUMEN -->
  <div id="ventasResumen"></div>

  <!-- LISTA DE VENTAS -->
  <div id="ventasListContainer" style="display: grid; gap: 15px;">
    <div style="text-align: center; color: #999; padding: 40px;">
      <p>Cargando ventas...</p>
    </div>
  </div>
</div>

<!-- SCRIPT: Cargar sales-list -->
<script src="js/sales-list.js"></script>
