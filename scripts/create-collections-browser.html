<!DOCTYPE html>
<html>
<head>
    <title>Crear Colecciones - Firestore</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: Arial; padding: 40px; max-width: 800px; margin: 0 auto; }
        button { padding: 12px 24px; margin: 10px 5px; font-size: 16px; cursor: pointer; }
        .success { background: #10b981; color: white; border: none; }
        .primary { background: #3b82f6; color: white; border: none; }
        #log { background: #f3f4f6; padding: 20px; border-radius: 8px; margin-top: 20px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>🚀 Crear Colecciones de Ventas en Firestore</h1>
    
    <div>
        <h3>Paso 1: Autenticarse</h3>
        <button class="primary" onclick="signIn()">Iniciar Sesión</button>
        <span id="authStatus">No autenticado</span>
    </div>

    <div>
        <h3>Paso 2: Crear Colecciones</h3>
        <button class="success" onclick="createCollections()">Crear MetasVentasAnuales y Pedidos</button>
    </div>

    <div id="log"></div>

    <script>
        // Configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyB_QB5AOMTRUF1tPF0ypMYwlI2F16Ugy0w",
            authDomain: "executiveperformancek.firebaseapp.com",
            projectId: "executiveperformancek",
            storageBucket: "executiveperformancek.firebasestorage.app",
            messagingSenderId: "1010572776177",
            appId: "1:1010572776177:web:26432cf2220bfe11cccf50"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;

        // Verificar estado de autenticación
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                log(`✅ Autenticado como: ${user.email}`);
                document.getElementById('authStatus').textContent = `✅ ${user.email}`;
            } else {
                currentUser = null;
                document.getElementById('authStatus').textContent = '❌ No autenticado';
            }
        });

        function log(message) {
            const logDiv = document.getElementById('log');
            logDiv.textContent += message + '\n';
            console.log(message);
        }

        async function signIn() {
            try {
                // Redirigir a la página de login de tu app
                const email = prompt('Email:');
                const password = prompt('Password:');
                
                if (email && password) {
                    await auth.signInWithEmailAndPassword(email, password);
                    log('✅ Inicio de sesión exitoso');
                }
            } catch (error) {
                log('❌ Error: ' + error.message);
            }
        }

        async function createCollections() {
            if (!currentUser) {
                alert('Por favor inicia sesión primero');
                return;
            }

            try {
                log('\n🚀 Iniciando creación de colecciones...\n');

                const userId = currentUser.uid;
                const userEmail = currentUser.email;

                // 1. Crear MetasVentasAnuales
                log('📊 Creando colección "MetasVentasAnuales"...');
                const metaRef = db.collection('MetasVentasAnuales').doc(userId);
                await metaRef.set({
                    executiveId: userId,
                    executiveEmail: userEmail,
                    annualGoal: 800,
                    year: 2025,
                    createdAt: firebase.firestore.Timestamp.now(),
                    updatedAt: firebase.firestore.Timestamp.now()
                });
                log('✅ Meta anual creada: 800 ventas para 2025\n');

                // 2. Crear ejemplos en Pedidos
                log('📦 Creando colección "Pedidos" con ejemplos...');
                
                const pedidos = [
                    {
                        executiveId: userId,
                        executiveEmail: userEmail,
                        orderNumber: 'KO-' + Date.now(),
                        type: 'KOMERCIAL',
                        clientName: 'EJEMPLO CLIENTE 1',
                        cedula: '123456789',
                        hasDevice: true,
                        deviceType: 'TELEFONO',
                        deviceIMEI: '000111222333444',
                        status: 'COMPLETADA',
                        year: 2025,
                        registeredAt: firebase.firestore.Timestamp.now(),
                        completedAt: firebase.firestore.Timestamp.now()
                    },
                    {
                        executiveId: userId,
                        executiveEmail: userEmail,
                        orderNumber: 'SB-' + Date.now(),
                        type: 'SIEBEL',
                        clientName: 'EJEMPLO CLIENTE 2',
                        cedula: '987654321',
                        hasDevice: false,
                        deviceType: null,
                        deviceIMEI: null,
                        status: 'PENDIENTE',
                        year: 2025,
                        registeredAt: firebase.firestore.Timestamp.now(),
                        completedAt: null
                    }
                ];

                for (let i = 0; i < pedidos.length; i++) {
                    const pedidoRef = db.collection('Pedidos').doc();
                    pedidos[i].id = pedidoRef.id;
                    await pedidoRef.set(pedidos[i]);
                    log(`   ✅ Pedido ${i+1}: ${pedidos[i].orderNumber} (${pedidos[i].status})`);
                }

                log('\n🎉 ¡Colecciones creadas exitosamente!\n');
                log('📊 Resumen:');
                log(`   - MetasVentasAnuales: Meta de 800 ventas`);
                log(`   - Pedidos: 2 ejemplos (1 completada, 1 pendiente)`);
                log(`   - Progreso: 1/800 = 0.13%\n`);
                log('✅ Ahora recarga tu app y ve a "Registro de Ventas"');
                log('   Deberías ver: 1 / 800 en las métricas\n');

            } catch (error) {
                log('❌ Error: ' + error.message);
                console.error(error);
            }
        }
    </script>
</body>
</html>
